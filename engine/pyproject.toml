[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "stress_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
# The test image runs as a non-root user on a read-only source tree.
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N"]
# Exception names such as StoreUnbound carry no Error suffix.
ignore = ["N818"]

[tool.vulture]
# Parameters a signature fixes: a context manager's __exit__, a store method
# that mirrors pymongo, and a fixture requested only for its setup.
ignore_names = ["exc_val", "exc_tb", "return_document", "restore_rig"]
